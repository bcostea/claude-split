version: 2
builds:
  - id: claude-split
    main: .
    binary: claude-split
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: claude-split
    binary: claude-split
    homepage: "https://github.com/bcostea/claude-split"
    description: "Manage multiple isolated Claude Code profiles, each with its own config and login"
    repository:
      owner: bcostea
      name: homebrew-claude-tools
      # PAT with write access to the tap repo, provided in CI as a secret.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        # The binary is unsigned; strip the quarantine flag so macOS runs it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/claude-split"]
          end
