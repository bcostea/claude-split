name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release on this repo

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Builds + uploads the release on bcostea/claude-split.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the generated formula to bcostea/homebrew-claude-tools.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
